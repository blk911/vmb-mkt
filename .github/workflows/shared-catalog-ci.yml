name: Shared catalog checks
on:
  push:
    branches: [main, shared-catalog-durable-lists, repair-shared-fact-recovery, compact-catalog-dora-crossref, unified-prospect-workspace]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:catalog
      - run: npm run test:fact-recovery
      - run: npm run test:compact-dora
      - run: npm run test:workspace
      - name: Check bounded anonymous DORA transport
        run: node scripts/test_dora_official_transport.cjs
      - run: npm run typecheck:catalog
      - name: Lint shared catalog and list surfaces
        run: npx eslint src/lib/dora src/lib/catalog src/components/catalog src/app/api/catalog src/app/api/source-intake/dora-queue src/components/admin/source-intake/DoraQueueTable.tsx src/app/api/targets src/app/admin/_lib/targets src/lib/auth/access.ts src/lib/admin/operator-adapter.ts src/lib/admin/pipeline/canonical-store-config.ts src/lib/admin/pipeline/profile-*.ts src/lib/admin/pipeline/types.ts src/lib/admin/pipeline/validation.ts src/lib/admin/pipeline/validation-sort.ts src/lib/admin/pipeline/build-queue.ts src/components/admin/pipeline src/app/admin/validate src/lib/hashtag-paste-intake src/lib/source-intake/store.ts src/lib/source-intake/social-resolver.ts src/lib/source-intake/dora-resolver.ts src/lib/source-intake/types.ts src/lib/source-intake/phase2-types.ts src/lib/source-intake/firestore-staged-evidence.ts src/lib/source-intake/legacy-evidence-recovery.ts src/lib/source-intake/evidence-identity.ts src/lib/source-intake/process.ts src/lib/ops/targetWorkflow.ts src/app/api/dashboard/ops-report/route.ts src/app/api/integrations/highlevel/preview/route.ts src/lib/admin/workspace-nav.ts src/components/admin/PipelineNav.tsx src/app/_components/AppSwitchNav.tsx src/app/admin/prospects src/app/admin/lists src/app/admin/sources src/app/admin/tools src/app/dashboard/DashboardShell.tsx src/app/dashboard/layout.tsx src/app/dashboard/_lib/workspaceAlias.ts src/components/admin/pipeline/BuildPageClient.tsx
      - run: npm run build
